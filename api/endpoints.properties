# Endpoint registry for the apiCheck skill.
#
#   <key> = <path relative to apiBaseUrl.<env>>   (or a full https:// URL)
#
# A key lets a flow/test doc say `get vehicleFilterCount` instead of pasting a
# URL, so when a path moves it moves in exactly one place. Query strings are
# appended at call time: `api_action.sh get "vehicleFilterCount?x=1"`.
#
# Every key here has a contract doc under api/ describing its expected
# response and how each field maps to the UI — see api/README.md.

# Password login. Returns the session token used by every other call.
# Rate-limited: too many attempts locks the account out for 15 minutes, which
# is why runs should reuse the app's own token (see api/README.md) instead of
# logging in per run.
login              = /shield/admin/v3/login

# Which service tabs the app should show, plus assorted feature flags.
# Backs the Home tab row (FASTAG / GPS / FUEL / LOAD).
servicesInfo       = /rest/shield/app/services/info

# Counts behind the Vehicles screen's filter chips: running / stoppage /
# noInfo. See api/vehicleFilterCount.md.
vehicleFilterCount = /argus/app/vehicles/getAllFilterCount

# Live per-vehicle telemetry (speed, ignition, address, distance) for a POSTed
# list of vehicle ids. Response is a map keyed by vehicle id.
# See api/vehiclesDynamic.md.
vehiclesDynamic    = /rest/argus/app/vehicles-dynamic
