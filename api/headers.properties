# Static headers sent on EVERY apiCheck request, one `Name: Value` per line —
# the same shape as curl's -H flag. Blank lines and #-comments are ignored.
#
# These mirror what the Operator app itself sends. Keeping them here (instead
# of retyping them per call) is what makes an API check reproducible: if the
# backend starts gating on X-APP-VERSION, one line changes and every check
# follows.
#
# The auth token is NOT here — it is secret and per-session. It comes from
# `apiAuthHeader` in config.properties, filled from .auth_state / WE_API_TOKEN
# (see api/README.md).

X-APP-VERSION: 24.1.0
X-APP-NAME: 24.1.0
locale: en
X-APP-PLATFORM: android
ANDROID_VERSION: 16
DEVICE_NAME: samsung, SM-M356B
Cache-Control: no-cache
service: OperatorApp
X-DEVICE-ID: BP4A.251205.006
DEVICE-ID: 3773d3c1269744d59d751aec87abd164

# Identifies which operator account the API answers for. Must match the
# account the app is logged in as, or every UI-vs-API comparison compares two
# different fleets. The value for the test account is in
# application/test-data.md.
user-code: WE25622
