# For local Android emulator (uncomment when using Android):
platform=android
# For local iOS Simulator (uncomment when using iOS; not currently supported by this project's scripts):
#platform=ios
appiumServerUrl=http://localhost:4723

# Notification Settings
disableNotificationsBeforeLaunch=true

# ---------------------------------------------------------------------------
# apiCheck skill — backend API validation (see api/README.md)
#
# These control which backend the API checks talk to. They must point at the
# SAME environment as the app's own in-app Staging/Production toggle on the
# login screen, otherwise a UI-vs-API comparison is comparing two different
# datasets and will fail for the wrong reason.
#
# No secrets here — this file is committed. Tokens/credentials come from the
# WE_API_TOKEN / WE_API_MOBILE / WE_API_PASSWORD environment variables, or
# from `api_action.sh token-from-device`.
# ---------------------------------------------------------------------------
apiEnv=prod
apiBaseUrl.prod=https://wheelseye.com
apiBaseUrl.stage=
apiTimeoutSeconds=30

# How the token is attached to every request. {token} is substituted at call
# time. The Operator backend uses a plain `token:` header, not Bearer auth.
apiAuthHeader=token: {token}

# Used by `api_action.sh login`. Credentials are never read from this file —
# they come from WE_API_MOBILE / WE_API_PASSWORD in the environment.
apiLoginPath=login
apiLoginBody={"password":"{password}","type":"OPERATOR","userName":"{mobile}","userConsent":true}
apiLoginTokenPath=data.token

# Static request headers live in api/headers.properties (one `Name: Value` per
# line) — this backend needs about a dozen of them on every call.
